name: Cypress Tests

on:
  pull_request:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Cache Cypress binary
        uses: actions/cache@v4
        id: cypress-binary-cache
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            cypress-binary-${{ runner.os }}-

      - name: Install Cypress binary
        if: steps.cypress-binary-cache.outputs.cache-hit != 'true'
        run: pnpm exec cypress install

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          # We've already installed everything
          install: false
          build: pnpm build:mock
          start: pnpm start
          wait-on: 'http://localhost:3000'
          command: pnpm cy:run
